<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Tracking Draw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    body { font-family: 'Geist Mono', ui-monospace, monospace; color: #fff; }
    #stage { position: fixed; inset: 0; }
    #video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      filter: brightness(0.55) contrast(1.05) saturate(0.9);
    }
    #vignette {
      position: absolute; inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }
    canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .panel {
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #label {
      position: absolute;
      top: 28px; left: 50%;
      transform: translateX(-50%);
      padding: 10px 22px;
      border-radius: 999px;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 17px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    #label .dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #9bf6a8;
      margin-right: 10px;
      vertical-align: middle;
      box-shadow: 0 0 12px #9bf6a8;
      animation: pulse 1.8s ease-in-out infinite;
      transition: background 0.2s, box-shadow 0.2s;
    }
    #label.idle .dot { background: rgba(255,255,255,0.5); box-shadow: 0 0 8px rgba(255,255,255,0.3); }
    #label.eraser .dot { background: #ff6b9d; box-shadow: 0 0 12px #ff6b9d; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    #palette {
      position: absolute;
      right: 22px; top: 50%;
      transform: translateY(-50%);
      padding: 14px 11px;
      border-radius: 28px;
      display: flex; flex-direction: column;
      gap: 11px;
      pointer-events: auto;
    }
    .swatch {
      width: 26px; height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 1.5px solid rgba(255,255,255,0.25);
      transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), border-color 0.18s;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.active {
      transform: scale(1.25);
      border-color: rgba(255,255,255,0.9);
      box-shadow: 0 0 18px currentColor;
    }
    #toolbar {
      position: absolute;
      bottom: 28px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 10px;
      pointer-events: auto;
    }
    .btn {
      padding: 11px 20px;
      border-radius: 999px;
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
    #hint {
      position: absolute;
      bottom: 30px; right: 26px;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      text-align: right;
      line-height: 1.6;
      max-width: 240px;
    }
    #brand {
      position: absolute;
      top: 28px; left: 28px;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 22px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.5px;
    }
    #cursor {
      position: absolute;
      pointer-events: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.1);
      transform: translate(-50%, -50%);
      transition: width 0.18s, height 0.18s, background 0.18s, border-color 0.18s, box-shadow 0.18s;
      display: none;
    }
    #cursor.drawing {
      width: 18px; height: 18px;
      border-color: rgba(255,255,255,0.95);
      box-shadow: 0 0 14px rgba(255,255,255,0.5);
    }
    #cursor.eraser {
      width: 44px; height: 44px;
      background: rgba(255,107,157,0.15);
      border-color: rgba(255,107,157,0.7);
      box-shadow: 0 0 18px rgba(255,107,157,0.4);
    }
    #loader {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 24px;
      color: rgba(255,255,255,0.7);
      transition: opacity 0.5s;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" autoplay muted playsinline></video>
    <div id="vignette"></div>
    <canvas id="drawCanvas"></canvas>
    <canvas id="overlayCanvas"></canvas>

    <div id="brand">draw with your hand</div>

    <div id="label" class="panel idle">
      <span class="dot"></span><span id="mode-text">point to draw</span>
    </div>

    <div id="palette" class="panel">
      <div class="swatch active" style="background:#ffffff; color:#ffffff;" data-color="#ffffff"></div>
      <div class="swatch" style="background:#ff6b9d; color:#ff6b9d;" data-color="#ff6b9d"></div>
      <div class="swatch" style="background:#ff8c42; color:#ff8c42;" data-color="#ff8c42"></div>
      <div class="swatch" style="background:#ffd166; color:#ffd166;" data-color="#ffd166"></div>
      <div class="swatch" style="background:#9bf6a8; color:#9bf6a8;" data-color="#9bf6a8"></div>
      <div class="swatch" style="background:#6ec5ff; color:#6ec5ff;" data-color="#6ec5ff"></div>
      <div class="swatch" style="background:#c4a8ff; color:#c4a8ff;" data-color="#c4a8ff"></div>
      <div class="swatch" style="background:#0a0a0a; border-color: rgba(255,255,255,0.4); color:#888;" data-color="#0a0a0a"></div>
    </div>

    <div id="cursor"></div>

    <div id="toolbar">
      <button class="btn panel" id="clear-btn">clear</button>
      <button class="btn panel" id="save-btn">save</button>
    </div>

    <div id="hint">
      point your index finger to draw.<br>
      open hand or peace sign = pen up.<br>
      pinch thumb &amp; index = toggle eraser.
    </div>

    <div id="loader">opening the camera…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <script>
    const video = document.getElementById('video');
    const drawCanvas = document.getElementById('drawCanvas');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const drawCtx = drawCanvas.getContext('2d');
    const overlayCtx = overlayCanvas.getContext('2d');
    const labelEl = document.getElementById('label');
    const modeText = document.getElementById('mode-text');
    const cursor = document.getElementById('cursor');
    const loader = document.getElementById('loader');

    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],
      [9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],
      [0,17]
    ];

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      [drawCanvas, overlayCanvas].forEach(c => {
        c.width = window.innerWidth * dpr;
        c.height = window.innerHeight * dpr;
        c.style.width = window.innerWidth + 'px';
        c.style.height = window.innerHeight + 'px';
        c.getContext('2d').scale(dpr, dpr);
      });
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
    }
    resize();
    window.addEventListener('resize', resize);

    let currentColor = '#ffffff';
    let isEraserMode = false;
    let pinchActive = false;
    let lastToggleTime = 0;
    let prevPoint = null;
    let smoothed = null;

    document.querySelectorAll('.swatch').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        el.classList.add('active');
        currentColor = el.dataset.color;
        if (isEraserMode) {
          isEraserMode = false;
          updateLabel(false);
        }
      });
    });

    function updateLabel(isDrawing) {
      labelEl.classList.remove('idle', 'eraser');
      if (isEraserMode) {
        labelEl.classList.add('eraser');
        modeText.textContent = isDrawing ? 'erasing' : 'eraser mode';
      } else if (isDrawing) {
        modeText.textContent = 'drawing';
      } else {
        labelEl.classList.add('idle');
        modeText.textContent = 'point to draw';
      }
    }

    document.getElementById('clear-btn').addEventListener('click', () => {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    });

    document.getElementById('save-btn').addEventListener('click', () => {
      const out = document.createElement('canvas');
      out.width = window.innerWidth;
      out.height = window.innerHeight;
      const octx = out.getContext('2d');
      octx.fillStyle = '#0a0a0a';
      octx.fillRect(0, 0, out.width, out.height);
      octx.save();
      octx.translate(out.width, 0);
      octx.scale(-1, 1);
      octx.filter = 'brightness(0.55) contrast(1.05) saturate(0.9)';
      octx.drawImage(video, 0, 0, out.width, out.height);
      octx.restore();
      octx.drawImage(drawCanvas, 0, 0, out.width, out.height);
      const link = document.createElement('a');
      link.download = 'hand-drawing.png';
      link.href = out.toDataURL('image/png');
      link.click();
    });

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    // Drawing gesture: index extended, middle finger NOT extended
    // (so open hand or peace sign won't draw)
    function isPointingGesture(lm) {
      const indexUp = lm[8].y < lm[6].y;
      const middleUp = lm[12].y < lm[10].y;
      return indexUp && !middleUp;
    }

    function drawSkeleton(lm, w, h) {
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      // Bone lines
      overlayCtx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
      overlayCtx.lineWidth = 1.5;
      for (const [a, b] of HAND_CONNECTIONS) {
        const xa = (1 - lm[a].x) * w;
        const ya = lm[a].y * h;
        const xb = (1 - lm[b].x) * w;
        const yb = lm[b].y * h;
        overlayCtx.beginPath();
        overlayCtx.moveTo(xa, ya);
        overlayCtx.lineTo(xb, yb);
        overlayCtx.stroke();
      }

      // Joint dots
      overlayCtx.fillStyle = 'rgba(255, 200, 220, 0.95)';
      for (let i = 0; i < lm.length; i++) {
        const x = (1 - lm[i].x) * w;
        const y = lm[i].y * h;
        overlayCtx.beginPath();
        overlayCtx.arc(x, y, i === 8 ? 5 : 3, 0, Math.PI * 2);
        overlayCtx.fill();
      }
    }

    function onResults(results) {
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        prevPoint = null;
        smoothed = null;
        cursor.style.display = 'none';
        updateLabel(false);
        return;
      }

      const lm = results.multiHandLandmarks[0];

      drawSkeleton(lm, window.innerWidth, window.innerHeight);

      const thumbTip = lm[4];
      const indexTip = lm[8];
      const fingerDist = dist(thumbTip, indexTip);
      const handSize = dist(lm[5], lm[17]);
      const ratio = handSize > 0 ? fingerDist / handSize : 1;

      const now = Date.now();
      const isPinching = ratio < 0.35;

      // Pinch toggles eraser (debounced)
      if (isPinching && !pinchActive && now - lastToggleTime > 600) {
        isEraserMode = !isEraserMode;
        pinchActive = true;
        lastToggleTime = now;
      }
      if (!isPinching && ratio > 0.55) {
        pinchActive = false;
      }

      const pointing = isPointingGesture(lm);
      const isDrawing = pointing && !isPinching;

      updateLabel(isDrawing);

      // Mirror x
      const x = (1 - indexTip.x) * window.innerWidth;
      const y = indexTip.y * window.innerHeight;

      if (!smoothed) {
        smoothed = { x, y };
      } else {
        smoothed.x = smoothed.x * 0.55 + x * 0.45;
        smoothed.y = smoothed.y * 0.55 + y * 0.45;
      }

      cursor.style.display = 'block';
      cursor.style.left = smoothed.x + 'px';
      cursor.style.top = smoothed.y + 'px';
      cursor.classList.toggle('eraser', isEraserMode);
      cursor.classList.toggle('drawing', isDrawing && !isEraserMode);
      if (!isEraserMode) {
        cursor.style.background = isDrawing ? currentColor : 'rgba(255,255,255,0.1)';
      }

      if (isDrawing) {
        if (isEraserMode) {
          drawCtx.save();
          drawCtx.globalCompositeOperation = 'destination-out';
          drawCtx.beginPath();
          drawCtx.arc(smoothed.x, smoothed.y, 22, 0, Math.PI * 2);
          drawCtx.fill();
          drawCtx.restore();
          prevPoint = null;
        } else {
          if (prevPoint) {
            drawCtx.beginPath();
            drawCtx.strokeStyle = currentColor;
            drawCtx.lineWidth = 4.5;
            drawCtx.shadowColor = currentColor;
            drawCtx.shadowBlur = 6;
            drawCtx.moveTo(prevPoint.x, prevPoint.y);
            drawCtx.lineTo(smoothed.x, smoothed.y);
            drawCtx.stroke();
            drawCtx.shadowBlur = 0;
          }
          prevPoint = { x: smoothed.x, y: smoothed.y };
        }
      } else {
        prevPoint = null;
      }
    }

    async function start() {
      try {
        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        const camera = new Camera(video, {
          onFrame: async () => { await hands.send({ image: video }); },
          width: 1280,
          height: 720
        });
        await camera.start();

        loader.classList.add('hidden');
        updateLabel(false);
      } catch (err) {
        console.error(err);
        loader.textContent = "couldn't open the camera. allow access and refresh.";
      }
    }

    start();
  </script>
</body>
</html>
