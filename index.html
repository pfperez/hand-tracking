<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Tracking Draw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    body {
      font-family: 'Geist Mono', ui-monospace, monospace;
      color: #fff;
    }
    #stage { position: fixed; inset: 0; }
    #video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      filter: brightness(0.55) contrast(1.05) saturate(0.9);
    }
    #vignette {
      position: absolute; inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }
    #canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }
    .panel {
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #label {
      position: absolute;
      top: 28px; left: 50%;
      transform: translateX(-50%);
      padding: 10px 22px;
      border-radius: 999px;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 17px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    #label .dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #fff;
      margin-right: 10px;
      vertical-align: middle;
      box-shadow: 0 0 12px rgba(255,255,255,0.8);
      animation: pulse 1.8s ease-in-out infinite;
    }
    #label.eraser .dot { background: #ff6b9d; box-shadow: 0 0 12px #ff6b9d; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    #palette {
      position: absolute;
      right: 22px; top: 50%;
      transform: translateY(-50%);
      padding: 14px 11px;
      border-radius: 28px;
      display: flex; flex-direction: column;
      gap: 11px;
    }
    .swatch {
      width: 26px; height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 1.5px solid rgba(255,255,255,0.25);
      transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), border-color 0.18s;
      position: relative;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.active {
      transform: scale(1.25);
      border-color: rgba(255,255,255,0.9);
      box-shadow: 0 0 18px currentColor;
    }
    #toolbar {
      position: absolute;
      bottom: 28px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 10px;
    }
    .btn {
      padding: 11px 20px;
      border-radius: 999px;
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    #hint {
      position: absolute;
      bottom: 30px; right: 26px;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      text-align: right;
      line-height: 1.6;
      max-width: 220px;
    }
    #brand {
      position: absolute;
      top: 28px; left: 28px;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 22px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.5px;
    }
    #cursor {
      position: absolute;
      pointer-events: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.9);
      transform: translate(-50%, -50%);
      transition: width 0.15s, height 0.15s, background 0.15s;
      box-shadow: 0 0 12px rgba(255,255,255,0.4);
      display: none;
    }
    #cursor.eraser {
      width: 44px; height: 44px;
      background: rgba(255,107,157,0.15);
      border-color: rgba(255,107,157,0.7);
      box-shadow: 0 0 18px rgba(255,107,157,0.4);
    }
    #loader {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 24px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.5px;
      transition: opacity 0.5s;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #error {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      padding: 24px 32px;
      max-width: 380px;
      border-radius: 16px;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 17px;
      color: #fff;
      text-align: center;
      line-height: 1.5;
      display: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" autoplay muted playsinline></video>
    <div id="vignette"></div>
    <canvas id="canvas"></canvas>

    <div id="brand">draw with your hand</div>

    <div id="label" class="panel">
      <span class="dot"></span><span id="mode-text">starting up</span>
    </div>

    <div id="palette" class="panel">
      <div class="swatch active" style="background:#ffffff; color:#ffffff;" data-color="#ffffff"></div>
      <div class="swatch" style="background:#ff6b9d; color:#ff6b9d;" data-color="#ff6b9d"></div>
      <div class="swatch" style="background:#ff8c42; color:#ff8c42;" data-color="#ff8c42"></div>
      <div class="swatch" style="background:#ffd166; color:#ffd166;" data-color="#ffd166"></div>
      <div class="swatch" style="background:#9bf6a8; color:#9bf6a8;" data-color="#9bf6a8"></div>
      <div class="swatch" style="background:#6ec5ff; color:#6ec5ff;" data-color="#6ec5ff"></div>
      <div class="swatch" style="background:#c4a8ff; color:#c4a8ff;" data-color="#c4a8ff"></div>
      <div class="swatch" style="background:#0a0a0a; border-color: rgba(255,255,255,0.4); color:#888;" data-color="#0a0a0a"></div>
    </div>

    <div id="cursor"></div>

    <div id="toolbar">
      <button class="btn panel" id="clear-btn">clear</button>
      <button class="btn panel" id="save-btn">save</button>
    </div>

    <div id="hint">
      point your index finger to draw.<br>
      pinch thumb &amp; index to toggle eraser.
    </div>

    <div id="loader">opening the camera…</div>
    <div id="error" class="panel"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const labelEl = document.getElementById('label');
    const modeText = document.getElementById('mode-text');
    const cursor = document.getElementById('cursor');
    const loader = document.getElementById('loader');
    const errorBox = document.getElementById('error');

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.scale(dpr, dpr);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    resize();
    window.addEventListener('resize', resize);

    // State
    let currentColor = '#ffffff';
    let isEraserMode = false;
    let pinchActive = false;
    let lastToggleTime = 0;
    let prevPoint = null;
    let smoothed = null;

    // Color swatches
    document.querySelectorAll('.swatch').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        el.classList.add('active');
        currentColor = el.dataset.color;
        if (isEraserMode) {
          isEraserMode = false;
          updateLabel();
        }
      });
    });

    function updateLabel() {
      modeText.textContent = isEraserMode ? 'eraser mode' : 'hand tracking';
      labelEl.classList.toggle('eraser', isEraserMode);
    }

    document.getElementById('clear-btn').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    document.getElementById('save-btn').addEventListener('click', () => {
      // Composite video + drawings into one image
      const out = document.createElement('canvas');
      out.width = window.innerWidth;
      out.height = window.innerHeight;
      const octx = out.getContext('2d');
      octx.fillStyle = '#0a0a0a';
      octx.fillRect(0, 0, out.width, out.height);
      // Mirror the video
      octx.save();
      octx.translate(out.width, 0);
      octx.scale(-1, 1);
      octx.filter = 'brightness(0.55) contrast(1.05) saturate(0.9)';
      octx.drawImage(video, 0, 0, out.width, out.height);
      octx.restore();
      // Overlay canvas
      octx.drawImage(canvas, 0, 0, out.width, out.height);
      const link = document.createElement('a');
      link.download = 'hand-drawing.png';
      link.href = out.toDataURL('image/png');
      link.click();
    });

    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    function onResults(results) {
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        prevPoint = null;
        smoothed = null;
        cursor.style.display = 'none';
        return;
      }

      const lm = results.multiHandLandmarks[0];
      const thumbTip = lm[4];
      const indexTip = lm[8];
      const fingerDist = dist(thumbTip, indexTip);
      const handSize = dist(lm[5], lm[17]);
      const ratio = handSize > 0 ? fingerDist / handSize : 1;

      const now = Date.now();
      const isPinching = ratio < 0.35;

      // Pinch toggles eraser (debounced)
      if (isPinching && !pinchActive && now - lastToggleTime > 600) {
        isEraserMode = !isEraserMode;
        pinchActive = true;
        lastToggleTime = now;
        updateLabel();
      }
      if (!isPinching && ratio > 0.55) {
        pinchActive = false;
      }

      // Mirror x (video is mirrored visually)
      const x = (1 - indexTip.x) * window.innerWidth;
      const y = indexTip.y * window.innerHeight;

      if (!smoothed) {
        smoothed = { x, y };
      } else {
        smoothed.x = smoothed.x * 0.55 + x * 0.45;
        smoothed.y = smoothed.y * 0.55 + y * 0.45;
      }

      // Cursor
      cursor.style.display = 'block';
      cursor.style.left = smoothed.x + 'px';
      cursor.style.top = smoothed.y + 'px';
      cursor.classList.toggle('eraser', isEraserMode);
      if (!isEraserMode) {
        cursor.style.background = currentColor;
        cursor.style.borderColor = 'rgba(255,255,255,0.9)';
      }

      if (isEraserMode) {
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(smoothed.x, smoothed.y, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        prevPoint = null;
      } else if (!isPinching) {
        if (prevPoint) {
          ctx.beginPath();
          ctx.strokeStyle = currentColor;
          ctx.lineWidth = 4.5;
          ctx.shadowColor = currentColor;
          ctx.shadowBlur = 6;
          ctx.moveTo(prevPoint.x, prevPoint.y);
          ctx.lineTo(smoothed.x, smoothed.y);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
        prevPoint = { x: smoothed.x, y: smoothed.y };
      } else {
        // pinching but not in eraser mode = stop drawing line (lift pen)
        prevPoint = null;
      }
    }

    async function start() {
      try {
        // MediaPipe Hands setup
        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        const camera = new Camera(video, {
          onFrame: async () => { await hands.send({ image: video }); },
          width: 1280,
          height: 720
        });
        await camera.start();

        loader.classList.add('hidden');
        updateLabel();
      } catch (err) {
        loader.style.display = 'none';
        errorBox.style.display = 'block';
        errorBox.innerHTML = 'couldn\'t open the camera.<br><br>make sure you clicked <b>allow</b> when your browser asked, then refresh the page.';
        console.error(err);
      }
    }

    start();
  </script>
</body>
</html>
